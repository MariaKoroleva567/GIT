<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет организации — Госуслуги</title>
<style>
  :root {
    --bg: #f4f6f9;
    --accent: #2b6de5;
    --btn: rgba(16, 24, 36, .78);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 560px;
    height: 600px;
    overflow: hidden;
    background: var(--bg);
    user-select: none;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: 560px;
    height: 600px;
    background: var(--bg);
    overflow: hidden;
  }
  .viewport {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .track {
    width: 100%;
    height: 100%;
    display: flex;
    transition: transform .35s cubic-bezier(.22,.9,.28,1);
    will-change: transform;
  }
  .slide {
    min-width: 560px;
    width: 560px;
    height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--bg);
    padding: 8px 36px 28px;
  }
  .slide img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    background: #fff;
    box-shadow: 0 4px 16px rgba(16,24,36,.12);
  }
  .nav, .zoom-btn {
    position: absolute;
    z-index: 6;
    border: 0;
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    background: var(--btn);
    box-shadow: 0 4px 12px rgba(0,0,0,.22);
  }
  .nav {
    top: 50%;
    width: 28px;
    height: 48px;
    transform: translateY(-50%);
  }
  .prev { left: 0; border-radius: 0 8px 8px 0; }
  .next { right: 0; border-radius: 8px 0 0 8px; }
  .nav:hover, .zoom-btn:hover { background: var(--accent); }
  .nav:disabled { opacity: .25; pointer-events: none; }
  .zoom-btn {
    right: 8px;
    bottom: 8px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
  }
  .dots {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    z-index: 5;
    pointer-events: none;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(16,24,36,.22);
  }
  .dot.on {
    width: 16px;
    border-radius: 99px;
    background: var(--accent);
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: #0b1018;
    display: none;
    z-index: 20;
    cursor: grab;
    overflow: hidden;
  }
  .overlay.on { display: block; }
  .overlay.grabbing { cursor: grabbing; }
  .zoomed {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: center center;
    max-width: none;
    max-height: none;
    user-select: none;
    pointer-events: none;
    background: #fff;
  }
  .hint {
    position: absolute;
    left: 8px;
    right: 44px;
    bottom: 8px;
    color: rgba(255,255,255,.7);
    font-size: 11px;
    pointer-events: none;
  }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="stage">
  <div class="viewport" id="viewport">
    <div class="track" id="track"></div>
  </div>
  <button class="nav prev" id="prev" aria-label="Назад">
    <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <button class="nav next" id="next" aria-label="Вперёд">
    <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <button class="zoom-btn" id="zoom" aria-label="Зум">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="M16 16l5 5"/><path d="M11 8v6M8 11h6"/></svg>
  </button>
  <div class="dots" id="dots"></div>
</div>

<div class="overlay" id="overlay">
  <img class="zoomed" id="zoomed" alt="">
  <div class="hint">колёсико — масштаб · перетаскивание · Esc — закрыть</div>
</div>

const track = document.getElementById("track");
const dots = document.getElementById("dots");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const zoomBtn = document.getElementById("zoom");
const overlay = document.getElementById("overlay");
const zoomed = document.getElementById("zoomed");
const viewport = document.getElementById("viewport");

let i = 0;
let zScale = 1, zTx = 0, zTy = 0, zDrag = null;

function render() {
  track.innerHTML = slides.map((s, n) =>
    `<div class="slide"><img src="${s.src}" alt="Слайд ${n+1}" draggable="false"></div>`
  ).join("");
  dots.innerHTML = slides.map((_, n) => `<div class="dot${n===0?" on":""}"></div>`).join("");
}
function go(n) {
  i = Math.max(0, Math.min(slides.length - 1, n));
  track.style.transform = `translateX(${-i * 100}%)`;
  [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
  prev.disabled = i === 0;
  next.disabled = i === slides.length - 1;
}
function openZoom() {
  const img = track.querySelectorAll("img")[i];
  const w = img.naturalWidth || 1200, h = img.naturalHeight || 600;
  zoomed.src = slides[i].src;
  zScale = Math.min(560 / w, 600 / h);
  zTx = 0; zTy = 0;
  applyZoom();
  overlay.classList.add("on");
}
function closeZoom() {
  overlay.classList.remove("on", "grabbing");
  zDrag = null;
}
function applyZoom() {
  zoomed.style.transform = `translate(calc(-50% + ${zTx}px), calc(-50% + ${zTy}px)) scale(${zScale})`;
}

prev.onclick = () => go(i - 1);
next.onclick = () => go(i + 1);
zoomBtn.onclick = () => overlay.classList.contains("on") ? closeZoom() : openZoom();

document.addEventListener("keydown", e => {
  if (overlay.classList.contains("on")) {
    if (e.key === "Escape") closeZoom();
    if (e.key === "+" || e.key === "=") { zScale = Math.min(5, zScale * 1.15); applyZoom(); }
    if (e.key === "-" || e.key === "_") { zScale = Math.max(.3, zScale / 1.15); applyZoom(); }
    return;
  }
  if (e.key === "ArrowLeft") go(i - 1);
  if (e.key === "ArrowRight") go(i + 1);
});

overlay.addEventListener("click", e => { if (e.target === overlay) closeZoom(); });
overlay.addEventListener("wheel", e => {
  e.preventDefault();
  zScale = Math.min(5, Math.max(.3, zScale * (e.deltaY < 0 ? 1.12 : 1/1.12)));
  applyZoom();
}, {passive:false});
overlay.addEventListener("pointerdown", e => {
  zDrag = {x: e.clientX - zTx, y: e.clientY - zTy};
  overlay.classList.add("grabbing");
  overlay.setPointerCapture(e.pointerId);
});
overlay.addEventListener("pointermove", e => {
  if (!zDrag) return;
  zTx = e.clientX - zDrag.x;
  zTy = e.clientY - zDrag.y;
  applyZoom();
});
overlay.addEventListener("pointerup", () => { zDrag = null; overlay.classList.remove("grabbing"); });

let sx = 0;
viewport.addEventListener("pointerdown", e => { sx = e.clientX; });
viewport.addEventListener("pointerup", e => {
  const dx = e.clientX - sx;
  if (Math.abs(dx) > 50) go(i + (dx < 0 ? 1 : -1));
});

render();
go(0);
</script>
